<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f2430">
<title>WordGrid</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root {
    --bg: #1f2430;
    --panel: #2a3040;
    --tile: #f3efe6;
    --tile-text: #1f2430;
    --text: #e9e6df;
    --muted: #9aa3b5;
    --tint: rgba(90, 150, 240, 0.32);
    --tint-solid: rgb(90, 150, 240);
    --good: rgb(80, 190, 120);
    --hint: rgb(196, 120, 255);
    --bad: rgb(230, 95, 85);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%;
    background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    user-select: none; -webkit-user-select: none;
  }
  body {
    display: flex; flex-direction: column; align-items: center;
    padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
  }
  header {
    width: 100%; max-width: 480px;
    display: flex; align-items: baseline; justify-content: space-between;
    margin-bottom: 8px;
  }
  h1 { font-size: 1.3rem; margin: 0; font-weight: 600; letter-spacing: 0.02em; }
  .score { font-size: 1.5rem; font-variant-numeric: tabular-nums; font-weight: 600; }
  .score .of { color: var(--muted); font-weight: 400; }
  .bonus {
    display: inline-block; margin-left: 8px; font-size: 1rem;
    color: #f2c14e; font-weight: 700; vertical-align: super;
  }
  .bonus.hidden { visibility: hidden; }
  .bonus.pop { animation: pop 0.45s ease; }
  @keyframes pop { 0% { transform: scale(1); } 40% { transform: scale(1.6); } 100% { transform: scale(1); } }
  #message {
    height: 1.6em; margin: 4px 0 10px; color: var(--muted);
    font-size: 1rem; text-align: center; transition: opacity 0.2s;
  }
  #boardWrap { position: relative; width: 100%; max-width: 480px; }
  #board {
    display: grid; grid-template-columns: repeat(5, 1fr); grid-template-rows: repeat(4, 1fr);
    gap: 10px; width: 100%; aspect-ratio: 5 / 4;
  }
  .tile {
    position: relative; z-index: 1;
    display: flex; align-items: center; justify-content: center;
    background: var(--tile); color: var(--tile-text);
    border-radius: 10px; border: 3px solid transparent;
    font-size: clamp(1.6rem, 8vw, 2.6rem); font-weight: 700;
    cursor: pointer; touch-action: manipulation;
    transition: background 0.12s, opacity 0.35s, transform 0.12s;
  }
  .tile:active { transform: scale(0.95); }
  .tile.selected { background: color-mix(in srgb, var(--tile) 70%, var(--tint-solid)); border-color: var(--tint-solid); }
  .tile.good { background: color-mix(in srgb, var(--tile) 55%, var(--good)); border-color: var(--good); }
  .tile.bad { background: color-mix(in srgb, var(--tile) 60%, var(--bad)); border-color: var(--bad); }
  .tile.gone, .tile.covered, .tile.used { opacity: 0; pointer-events: none; }
  .tile.hint { box-shadow: 0 0 0 4px var(--hint), 0 0 14px 2px var(--hint); }
  #string { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 2; }
  #string polyline { fill: none; stroke: var(--tint-solid); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; opacity: 0.35; }
  #string.good polyline { stroke: var(--good); }
  #string.bad polyline { stroke: var(--bad); }
  .shake { animation: shake 0.38s ease; }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-10px); } 40% { transform: translateX(9px); }
    60% { transform: translateX(-6px); } 80% { transform: translateX(4px); }
  }
  .controls { margin-top: 22px; display: flex; flex-direction: column; align-items: center; gap: 16px; }
  .buttons { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  #serif[aria-pressed="true"] { background: var(--text); color: var(--bg); border-color: var(--text); }

  /* SERIF: plain black-on-white look */
  body.serif { background: #fff; color: #000; font-family: Georgia, "Times New Roman", serif; }
  body.serif h1, body.serif .score { font-weight: 400; }
  body.serif .score .of, body.serif #message, body.serif .cheat { color: #555; }
  body.serif .cheat input:checked ~ .label { color: #000; }
  body.serif .tile {
    background: #fff; color: #000; border-color: transparent; border-radius: 0;
    font-family: inherit; font-weight: 400;
  }
  body.serif .tile.selected { background: rgba(90, 150, 240, 0.16); border-color: transparent; }
  body.serif .tile.good { background: rgba(80, 190, 120, 0.22); border-color: transparent; }
  body.serif .tile.bad { background: rgba(230, 95, 85, 0.18); border-color: transparent; }
  body.serif button { background: #fff; color: #000; border-color: #bbb; font-family: inherit; }
  body.serif #serif[aria-pressed="true"] { background: #000; color: #fff; border-color: #000; }
  body.serif .slider { background: #ccc; }
  body.serif .dialog { background: #fff; color: #000; border: 1px solid #ccc; }
  body.serif button.primary { background: #000; color: #fff; border-color: #000; }

  .cheat { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 1rem; cursor: pointer; }
  .cheat input { display: none; }
  .slider {
    position: relative; width: 46px; height: 26px; border-radius: 999px;
    background: #4a5268; transition: background 0.2s;
  }
  .slider::after {
    content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px;
    border-radius: 50%; background: #fff; transition: transform 0.2s;
  }
  .cheat input:checked + .slider { background: var(--hint); }
  .cheat input:checked + .slider::after { transform: translateX(20px); }
  .cheat input:checked ~ .label { color: var(--text); }
  button {
    font: inherit; font-size: 1rem; padding: 10px 22px; border-radius: 999px;
    border: 1px solid #4a5268; background: var(--panel); color: var(--text); cursor: pointer;
  }
  button.primary { background: var(--tint-solid); border-color: var(--tint-solid); color: #fff; }
  #confirm {
    position: fixed; inset: 0; background: rgba(0,0,0,0.55);
    display: none; align-items: center; justify-content: center; z-index: 10;
  }
  #confirm.open { display: flex; }
  .dialog {
    background: var(--panel); border-radius: 14px; padding: 22px; width: min(320px, 90vw); text-align: center;
  }
  .dialog p { margin: 0 0 18px; font-size: 1.05rem; }
  .dialog .row { display: flex; gap: 12px; justify-content: center; }
  #loading { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--muted); }
</style>
</head>
<body>
  <header>
    <h1>WordGrid</h1>
    <div class="score"><span id="found">0</span><span class="of"> / 20</span><span id="bonus" class="bonus hidden">+0</span></div>
  </header>
  <div id="message"></div>
  <div id="boardWrap">
    <div id="board"></div>
    <svg id="string"><polyline points=""></polyline></svg>
    <div id="loading">Building a grid...</div>
  </div>
  <div class="controls">
    <label class="cheat"><input type="checkbox" id="cheat"><span class="slider"></span><span class="label">Cheat mode</span></label>
    <div class="buttons">
      <button id="shuffle">Shuffle</button>
      <button id="serif" aria-pressed="false">SERIF</button>
      <button id="newGrid">New grid</button>
    </div>
  </div>

  <div id="confirm">
    <div class="dialog">
      <p>New grid? This one's progress will be lost.</p>
      <div class="row">
        <button id="cancelNew">Keep playing</button>
        <button id="okNew" class="primary">New grid</button>
      </div>
    </div>
  </div>

  <script src="words.js"></script>
  <script src="app.js"></script>
</body>
</html>
